# The screenshot harness's KurrentDB. The staging nightly rather than a
# released version: the deploy-ledger metadata API the history shots show
# (deploy/rollback attribution, the branch-back rail) is unreleased, and a
# released server degrades history to hash-only entries. Digest-pinned so
# the regen workflow (which holds a write token) never pulls a floating
# tag; re-pin to a released image once the API ships.
#
# Bump (queries the registry live; a digest from an old local pull can
# already be gone from the staging registry):
#   docker buildx imagetools inspect docker.eventstore.com/kurrent-staging/kurrentdb:nightly
services:
  kurrentdb:
    image: docker.eventstore.com/kurrent-staging/kurrentdb@sha256:02ae09db9a4218e1c22cd5c731bf09efb8a0351005038fece0feabce6da8f529
    ports:
      - "2113:2113"
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_INSECURE=true
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_MEM_DB=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/gossip || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
