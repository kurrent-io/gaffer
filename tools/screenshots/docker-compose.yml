# The screenshot harness's KurrentDB. The staging nightly rather than a
# released version: the deploy-ledger metadata API the history shots show
# (deploy/rollback attribution, the branch-back rail) is unreleased, and a
# released server degrades history to hash-only entries.
#
# The floating tag is a deliberate exception to the repo's pin-everything
# discipline: the staging registry drops nightly manifests within days, so
# a digest pin means re-pinning before every regen dispatch (the first run
# failed exactly that way). The image is the database the CLI dials during
# capture, not code executing under the workflow's write token. Replace
# with a pinned released image once the metadata API ships.
services:
  kurrentdb:
    image: docker.eventstore.com/kurrent-staging/kurrentdb:nightly
    ports:
      - "2113:2113"
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_INSECURE=true
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_MEM_DB=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/gossip || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
