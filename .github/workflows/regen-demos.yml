name: Regenerate demo recordings

# Manually regenerates the docs media and opens a PR: the VHS demo
# recordings under assets/ and docs/public/, and the VS Code extension
# screenshots under docs/public/vscode/ (tools/screenshots). Run from the
# Actions tab when CLI output or an extension surface a recording depends
# on has changed.

on:
  workflow_dispatch:

concurrency:
  group: regen-demos
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: cli/go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.52.0

      - name: Install module dependencies
        run: just init

      - name: Publish runtime
        run: just runtime publish

      - name: Build CLI
        run: just cli build

      - name: Add gaffer CLI to PATH
        run: echo "$GITHUB_WORKSPACE/cli" >> "$GITHUB_PATH"

      # vhs-action@v2's built-in ffmpeg installer is unreliable
      # ("Failed to install ffmpeg", run 26033450846). Install the
      # stack ourselves: ffmpeg from apt, ttyd from its release binary,
      # vhs from go install. ttyd and vhs are pinned (bump by hand) - the
      # job holds contents/pull-requests:write, so a floating release
      # asset would be unverified code execution under that token.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ttyd
        run: |
          # sha256 from the release's SHA256SUMS asset; refresh on version bump.
          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /tmp/ttyd
          echo "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55  /tmp/ttyd" | sha256sum -c -
          chmod +x /tmp/ttyd
          sudo mv /tmp/ttyd /usr/local/bin/ttyd

      # Version is verified by the Go checksum database (sum.golang.org).
      - name: Install VHS
        run: go install github.com/charmbracelet/vhs@v0.11.0

      # The screenshot KurrentDB is the staging nightly - a floating tag,
      # deliberately (see tools/screenshots/docker-compose.yml); the
      # registry requires authentication. It serves the deploy tapes and
      # the VS Code screenshots alike.
      - name: Log in to the staging registry
        env:
          REGISTRY_USER: ${{ secrets.CLOUDSMITH_CICD_USER }}
          REGISTRY_TOKEN: ${{ secrets.CLOUDSMITH_CICD_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login docker.eventstore.com -u "$REGISTRY_USER" --password-stdin

      - name: Start KurrentDB
        run: just screenshots db-up

      # The seeded overlay workspace the deploy tapes record from.
      - name: Prepare the tape workspace
        run: just screenshots prepare-tapes

      # Run vhs from the demo/ directory so the recorded shell starts
      # there. Avoids a visible `cd demo` step in the recording (Hide
      # / Show in the tape file didn't suppress the prompt + command).
      - name: Regenerate demo recordings
        working-directory: demo
        run: |
          for tape in ../tools/vhs/*.tape; do
            echo "Recording $tape"
            vhs "$tape"
          done

      # The deploy tapes run from the seeded workspace, in filename order:
      # recordings mutate server state as they go (the deploy tape applies
      # the plan the earlier tapes rely on being pending), so the number
      # prefixes are load-bearing.
      - name: Regenerate deploy recordings
        working-directory: tools/screenshots/.workspace
        run: |
          for tape in ../../vhs/deploy/*.tape; do
            echo "Recording $tape"
            vhs "$tape"
          done

      # The tape recordings above deployed real state onto the server. The
      # screenshot capture seeds the same projection names, so recreate the
      # database empty between the phases - otherwise the capture's history
      # shots pick up the tape phase's entries and the output depends on
      # what ran before it.
      - name: Reset KurrentDB for the screenshot capture
        run: just screenshots db-reset

      # ---- VS Code extension screenshots (tools/screenshots) ----
      # xvfb and the shared libraries VS Code's Electron needs headless.
      # The harness itself pins and checksum-verifies its VS Code build and
      # companion extensions (tools/screenshots/src/vscode-pin.json).
      - name: Install xvfb and VS Code libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgtk-3-0 libgbm1 libasound2t64 libxkbfile1 libsecret-1-0

      - name: Package the VS Code extension
        run: just editors package

      - name: Capture VS Code screenshots
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' just screenshots capture

      - name: Publish screenshots
        run: just screenshots publish

      - name: Stop KurrentDB
        if: always()
        run: just screenshots db-down

      - name: Open PR with updated recordings
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Regenerate demo recordings
          title: Regenerate demo recordings
          body: |
            Regenerated docs media (vhs recordings under `assets/` and
            `docs/public/`, VS Code screenshots under `docs/public/vscode/`)
            via the
            [Regenerate demo recordings](https://github.com/${{ github.repository }}/actions/workflows/regen-demos.yml)
            workflow.

            Review the rendered images (not the binary diffs) before merging.
          branch: regen-demos
          add-paths: |
            assets/*.gif
            docs/public/*.gif
            docs/public/*.png
            docs/public/vscode/*.webp
          labels: documentation
